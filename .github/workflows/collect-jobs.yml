name: Daily job collection

on:
  schedule:
    # 00:00 UTC = 09:00 Asia/Seoul, every day.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      site:
        description: '검증할 목록 (예약 실행은 항상 all)'
        type: choice
        default: all
        options:
          - all
          - rndjob
          - loofit
          - saramin-home
          - saramin-kangso
          - jobkorea
          - jasoseol
          - egong

permissions:
  contents: read

concurrency:
  group: notion-job-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Korean and English OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          python -c "from ocr import check_engine; print(check_engine())"

      - name: Run storage tests
        run: python -m unittest discover -v

      - name: Install Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Collect jobs and sync to Notion
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PYTHONUNBUFFERED: '1'
          COLLECTION_SITE: ${{ inputs.site || 'all' }}
        run: |
          set -eo pipefail
          if [ -z "$NOTION_TOKEN" ]; then
            echo '::error::Add NOTION_TOKEN under repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
          case "$COLLECTION_SITE" in
            all) args=(--all) ;;
            rndjob) args=(--rndjob) ;;
            loofit) args=(--loofit) ;;
            saramin-home|saramin-kangso|jobkorea|jasoseol|egong) args=(--site "$COLLECTION_SITE") ;;
            *) echo '::error::Unknown collection site'; exit 1 ;;
          esac
          python -u fetch_page.py "${args[@]}" --notion --output postings.json | tee collection.log

      - name: Save collection result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            postings.json
            collection.log
            collection-report.json
          if-no-files-found: ignore
          retention-days: 7
