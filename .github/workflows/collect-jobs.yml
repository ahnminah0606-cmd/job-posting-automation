name: Daily job collection

on:
  schedule:
    # 00:00 UTC = 09:00 Asia/Seoul, every day.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-job-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run storage tests
        run: python -m unittest -v test_notion_sync

      - name: Install Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Collect jobs and sync to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo '::error::Add NOTION_TOKEN under repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
          python -u fetch_page.py --rndjob --loofit --notion --output postings.json | tee collection.log

      - name: Save collection result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            postings.json
            collection.log
          if-no-files-found: ignore
          retention-days: 7
