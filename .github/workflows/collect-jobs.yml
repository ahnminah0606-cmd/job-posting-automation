name: Daily job collection

on:
  schedule:
    # 00:00 and 09:00 UTC = 09:00 and 18:00 Asia/Seoul every day.
    - cron: '0 0,9 * * *'
  workflow_dispatch:
    inputs:
      site:
        description: '검증할 목록 (예약 실행은 항상 all)'
        type: choice
        default: all
        options:
          - all
          - rndjob
          - loofit
          - saramin-home
          - saramin-kangso
          - jobkorea
          - jasoseol
          - egong
          - catch
      depth:
        description: '수집 범위 (wide는 이전 목록까지 탐색)'
        type: choice
        default: normal
        options:
          - normal
          - wide

permissions:
  contents: read

concurrency:
  group: notion-job-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.depth == 'wide' && 120 || 60 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore OCR results
        uses: actions/cache@v5
        with:
          path: |
            .cache/ocr/*.json
            .cache/ocr/models/
          key: ${{ runner.os }}-ocr-${{ hashFiles('ocr.py', 'requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ocr-${{ hashFiles('ocr.py', 'requirements.txt') }}-

      - name: Prepare Korean and English OCR
        run: python -c "from ocr import check_engine; print(check_engine())"

      - name: Run parser, storage and OCR tests
        env:
          OCR_INTEGRATION: '1'
        run: python -m unittest discover -v

      - name: Install Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Collect jobs and sync to Notion
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PYTHONUNBUFFERED: '1'
          COLLECTION_SITE: ${{ inputs.site || 'all' }}
          COLLECTION_DEPTH: ${{ inputs.depth || 'normal' }}
        run: |
          set -eo pipefail
          if [ -z "$NOTION_TOKEN" ]; then
            echo '::error::Add NOTION_TOKEN under repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
          case "$COLLECTION_SITE" in
            all) args=(--all) ;;
            rndjob) args=(--rndjob) ;;
            loofit) args=(--loofit) ;;
            saramin-home|saramin-kangso|jobkorea|jasoseol|egong|catch) args=(--site "$COLLECTION_SITE") ;;
            *) echo '::error::Unknown collection site'; exit 1 ;;
          esac
          case "$COLLECTION_DEPTH" in
            normal) ;;
            wide) args+=(--pages 10 --limit 100) ;;
            *) echo '::error::Unknown collection depth'; exit 1 ;;
          esac
          python -u fetch_page.py "${args[@]}" --notion --output postings.json | tee collection.log

      - name: Save collection result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            postings.json
            collection.log
            collection-report.json
            .cache/ocr/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
