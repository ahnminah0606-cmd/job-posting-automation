name: Collector checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-detail-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OCR_INTEGRATION: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python and OCR dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - name: Run parser, storage and actual OCR tests
        run: python -m unittest discover -v
      - name: Verify public Jobkorea images without Notion writes
        run: |
          python -u fetch_page.py --site jobkorea --limit 5 --output postings.json
          python -c "import json; r=json.load(open('collection-report.json')); n=sum(e.get('lines',0)>0 for s in r for e in s.get('ocr',[])); print('OCR images with text:', n); assert n > 0, 'No detailed image reached OCR'"
      - name: Verify actual multi-role posters without Notion writes
        run: python -u verify_image_posters.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: collector-check-${{ github.run_id }}
          include-hidden-files: true
          path: |
            collection-report.json
            postings.json
            image-postings.json
            image-verification-report.json
            .cache/ocr/*.json
          retention-days: 7
